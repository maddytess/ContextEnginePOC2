context_builder_id: operations.estate_scan_context
name: estate_scan_context
display_name: Estate Scan Context
domain: operations
data_type: estate_scan_config
provider: aws
status: active
tenant_id: null

purpose: "Prepare scan target and account scope for triggering an AWS estate discovery scan."
output_schema_ref: schemas/estate_scan_config.yaml

collection_units:
  - unit_id: fetch_scan_target
    purpose: "determine scan scope — full or incremental — and target AWS profile"
    required: true
    context_type: scan_target
    preferred_tool_classes: [inventory_read]
    preferred_tool_tags: [scan, discover, estate, refresh]
    execution_locations: [client]
    freshness_window: 5m
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/estate_scan_config.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
