context_builder_id: compliance.iso27001_context
name: iso27001_context
display_name: ISO 27001 Compliance Context
domain: compliance
data_type: iso27001_compliance_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather cloud resource configuration data required for ISO 27001 Annex A control evaluation."
output_schema_ref: schemas/iso27001_compliance_inventory.yaml

collection_units:
  - unit_id: fetch_iso27001_inventory
    purpose: "collect IAM, logging, encryption, and security controls for ISO 27001 assessment"
    required: true
    context_type: account_scope
    preferred_tool_classes: [compliance_read]
    preferred_tool_tags: [iso27001, information-security, compliance, aws, azure]
    execution_locations: [client]
    freshness_window: 4h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/iso27001_compliance_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
