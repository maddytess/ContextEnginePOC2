context_builder_id: compliance.soc2_context
name: soc2_context
display_name: SOC 2 Compliance Context
domain: compliance
data_type: soc2_compliance_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather cloud resource inventory and configuration data required for SOC 2 Trust Service Criteria evaluation."
output_schema_ref: schemas/soc2_compliance_inventory.yaml

collection_units:
  - unit_id: fetch_soc2_inventory
    purpose: "collect IAM, CloudTrail, Config, CloudWatch, and encryption settings for SOC 2 assessment"
    required: true
    context_type: account_scope
    preferred_tool_classes: [compliance_read]
    preferred_tool_tags: [soc2, compliance, audit, aws, azure]
    execution_locations: [client]
    freshness_window: 4h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/soc2_compliance_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
