context_builder_id: billing.cost_context
name: cost_context
display_name: Billing Cost Context
domain: billing
data_type: billing_cost_data
provider: shared
status: active
tenant_id: null

purpose: "Gather cloud cost and usage data from AWS Cost Explorer or Azure Cost Management for billing analysis."
output_schema_ref: schemas/billing_cost_data.yaml

collection_units:
  - unit_id: fetch_cost_data
    purpose: "fetch cost and usage data for the requested time range and service filter"
    required: true
    context_type: billing_time_range
    preferred_tool_classes: [billing_read]
    preferred_tool_tags: [cost, billing, aws, azure]
    execution_locations: [client]
    freshness_window: 1h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/billing_cost_data.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
