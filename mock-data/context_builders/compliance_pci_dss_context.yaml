context_builder_id: compliance.pci_dss_context
name: pci_dss_context
display_name: PCI-DSS Compliance Context
domain: compliance
data_type: pci_dss_compliance_inventory
provider: aws
status: active
tenant_id: null

purpose: "Gather AWS network, cardholder data, access control, and logging configuration for PCI-DSS v4.0 evaluation."
output_schema_ref: schemas/pci_dss_compliance_inventory.yaml

collection_units:
  - unit_id: fetch_pci_dss_inventory
    purpose: "collect security groups NACLs encryption IAM and CloudTrail settings for PCI-DSS"
    required: true
    context_type: network_security_inventory
    preferred_tool_classes: [compliance_read]
    preferred_tool_tags: [pci, pci-dss, cardholder, compliance, aws]
    execution_locations: [client]
    freshness_window: 4h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/pci_dss_compliance_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
