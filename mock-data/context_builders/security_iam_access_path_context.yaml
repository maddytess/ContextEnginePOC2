context_builder_id: security.iam_access_path_context
name: iam_access_path_context
display_name: IAM Access Path Context
domain: security
data_type: iam_trust_graph
provider: shared
status: active
tenant_id: null

purpose: "Gather IAM trust relationships and role-chaining data for privilege escalation path analysis."
output_schema_ref: schemas/iam_trust_graph.yaml

collection_units:
  - unit_id: fetch_iam_trust_graph
    purpose: "collect IAM roles trust policies and assume-role relationships"
    required: true
    context_type: iam_trust_graph
    preferred_tool_classes: [iam_read]
    preferred_tool_tags: [iam, trust, role, privilege, escalation]
    execution_locations: [client]
    freshness_window: 1h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/iam_trust_graph.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
