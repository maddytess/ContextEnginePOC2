context_builder_id: compliance.gdpr_context
name: gdpr_context
display_name: GDPR Compliance Context
domain: compliance
data_type: gdpr_compliance_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather cloud resource configuration for GDPR data protection and privacy requirements evaluation."
output_schema_ref: schemas/gdpr_compliance_inventory.yaml

collection_units:
  - unit_id: fetch_gdpr_inventory
    purpose: "collect storage, database, and logging configuration for GDPR data protection assessment"
    required: true
    context_type: account_scope
    preferred_tool_classes: [compliance_read]
    preferred_tool_tags: [gdpr, privacy, data-protection, eu, compliance]
    execution_locations: [client]
    freshness_window: 4h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/gdpr_compliance_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
