context_builder_id: security.cloudtrail_context
name: cloudtrail_context
display_name: CloudTrail Audit Context
domain: security
data_type: audit_event_data
provider: shared
status: active
tenant_id: null

purpose: "Gather CloudTrail or Azure Activity Log events for who-did-what-when audit queries."
output_schema_ref: schemas/audit_event_data.yaml

collection_units:
  - unit_id: fetch_audit_events
    purpose: "fetch audit events matching the event filter actor and time range"
    required: true
    context_type: audit_event_filter
    preferred_tool_classes: [audit_read]
    preferred_tool_tags: [cloudtrail, events, activity, audit]
    execution_locations: [client]
    freshness_window: 30m
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/audit_event_data.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
