context_builder_id: security.iam_audit_context
name: iam_audit_context
display_name: IAM Security Audit Context
domain: security
data_type: iam_security_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather IAM user, role, policy, and access key inventory for comprehensive security audit."
output_schema_ref: schemas/iam_security_inventory.yaml

collection_units:
  - unit_id: fetch_iam_inventory
    purpose: "collect IAM users MFA status access keys roles and managed policies"
    required: true
    context_type: iam_user_inventory
    preferred_tool_classes: [iam_read]
    preferred_tool_tags: [iam, audit, mfa, access-keys, policy]
    execution_locations: [client]
    freshness_window: 1h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/iam_security_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
