context_builder_id: compliance.hipaa_context
name: hipaa_context
display_name: HIPAA Compliance Context
domain: compliance
data_type: hipaa_compliance_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather cloud resource configuration for HIPAA Security Rule safeguard evaluation."
output_schema_ref: schemas/hipaa_compliance_inventory.yaml

collection_units:
  - unit_id: fetch_hipaa_inventory
    purpose: "collect storage encryption, access controls, and audit logging data for HIPAA assessment"
    required: true
    context_type: account_scope
    preferred_tool_classes: [compliance_read]
    preferred_tool_tags: [hipaa, healthcare, phi, compliance, aws, azure]
    execution_locations: [client]
    freshness_window: 4h
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/hipaa_compliance_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
