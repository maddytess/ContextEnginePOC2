context_builder_id: operations.monitor_context
name: monitor_context
display_name: Infrastructure Monitor Context
domain: operations
data_type: infrastructure_metrics
provider: shared
status: active
tenant_id: null

purpose: "Gather infrastructure metrics from AWS CloudWatch or Azure Monitor for health and performance analysis."
output_schema_ref: schemas/infrastructure_metrics.yaml

collection_units:
  - unit_id: fetch_metrics
    purpose: "fetch metric values for the specified namespace, metric name, and time window"
    required: true
    context_type: metric_spec
    preferred_tool_classes: [metrics_read]
    preferred_tool_tags: [monitor, metrics, cloudwatch, azure-monitor]
    execution_locations: [client]
    freshness_window: 15m
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/infrastructure_metrics.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
