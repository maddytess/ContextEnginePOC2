context_builder_id: security.network_exposure_context
name: network_exposure_context
display_name: Network Exposure Context
domain: security
data_type: network_exposure_inventory
provider: shared
status: active
tenant_id: null

purpose: "Gather security group rules, public resource inventory, and VPC configuration for internet-facing exposure analysis."
output_schema_ref: schemas/network_exposure_inventory.yaml

collection_units:
  - unit_id: fetch_network_exposure_data
    purpose: "collect security groups public IPs VPC flow logs and internet-facing resource configuration"
    required: true
    context_type: network_security_inventory
    preferred_tool_classes: [inventory_read]
    preferred_tool_tags: [network, exposure, public, ingress, ssh, rdp]
    execution_locations: [client]
    freshness_window: 30m
    cache_policy: refresh_if_stale
    normalization_schema_ref: schemas/network_exposure_inventory.yaml

orchestration:
  merge_strategy: union
  dedupe_keys: [account_scope]
  max_parallel_units: 2

fallbacks:
  on_missing_required_context: request_more
  fallback_probe_policy: allowed_with_review

version: "0.1.0"
