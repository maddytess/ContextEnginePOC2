tool_id: aws.lock_security_group
name: Lock Security Group Ingress
purpose: Remove overly permissive ingress rules from a security group.
tool_class: action_write
tool_type: write

domain: [security]
provider: aws
resource_types:
  - security_group
api_calls:
  - ec2:RevokeSecurityGroupIngress
  - ec2:DescribeSecurityGroups

execution_location: client
execution_timeout: 120

input_schema:
  parameters:
    - name: group_id
      type: string
      required: true
      description: Security group ID to modify (e.g. sg-0abc123)
    - name: rules_to_revoke
      type: list
      required: true
      description: List of ingress rule objects (protocol, port range, cidr) to remove

output_schema_ref: schemas/security_group_mutation_result.yaml

safety_class: supervised_write
auth: null

idempotent: false
requires_human_review: true
rollback_supported: true
rollback_api:
  - ec2:AuthorizeSecurityGroupIngress

version: "0.1.0"
tenant_id: null
